name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install light dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests pandas yfinance pytest

      - name: Run unit tests (crewai-free)
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -q

  full:
    name: full (py3.12 + crewai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Sync project dependencies
        run: uv sync

      - name: Run full test suite
        run: uv run python -m pytest tests/ -q
