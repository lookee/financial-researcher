[project]
name = "financial-researcher"
version = "0.1.0"
description = "CrewAI multi-agent CLI for ISIN-based stock and ETF research reports"
readme = "README.md"
license = { text = "Unlicense" }
authors = [{ name = "Luca Amore", email = "luca.amore@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.108.0,<1.0.0",
    "yfinance>=0.2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
report = "financial_researcher.main:report_cli"
resolve = "financial_researcher.main:resolve_cli"
watchlist = "financial_researcher.main:watchlist_cli"
refresh-reports = "financial_researcher.main:refresh_reports_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
