[project]
name = "financial-researcher"
version = "0.2.0"
description = "CrewAI multi-agent CLI for Milan watchlist executive briefings"
readme = "README.md"
license = { text = "Unlicense" }
authors = [{ name = "Luca Amore", email = "luca.amore@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.114.0,<0.120.0",
    "yfinance>=0.2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
briefing = "financial_researcher.main:briefing_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.crewai]
type = "crew"
