# Tasks for ISIN-based instrument reports

news_research_task:
  description: >
    Collect recent news and events for {company} (ticker: {ticker}, ISIN: {isin}).
    Today is {current_date}.

    Pre-loaded market data is already available in market_context — do not
    re-fetch prices. Focus on news, corporate events, regulatory updates and
    official announcements from the last 72 hours.

    Requirements:
    - Use search and news tools before writing.
    - Assign [2], [3], ... to each new source ([1] is reserved for Yahoo Finance).
    - Cite every fact with [N].
    - Omit unsupported statements.

  expected_output: >
    A news brief with:
    - Recent news items (title, date, summary) each with [N]
    - Corporate or fund events with [N]
    - Risks or opportunities mentioned in sources with [N]
    - Riferimenti aggiuntivi: [N] Nome fonte, data, URL for N >= 2

  agent: news_researcher


compose_report_task:
  description: >
    Create a complete instrument report for {company} in {language}.
    ISIN: {isin} · Ticker: {ticker} · Type: {instrument_type}
    Today is {current_date}.

    MANDATORY: copy verbatim into the report all sections from market_summary below,
    including section headings exactly as written there.
    Do not replace numbers with a "data not available" placeholder when they are
    present in market_summary. Reference [1] for all market data.

    {market_summary}

    Identity metadata (JSON):
    {identity_context}

    News research output is in the task context above (references [2]+).

    Reference rules:
    - [1] = Yahoo Finance, {current_date}, URL from market_summary header
    - Every fact must have [N]. No uncited statements.
    - Only write a "data not available in sources consulted" message for sections
      genuinely absent from market_summary AND news research.
    - Copy verbatim the data limitations bullet list from market_summary;
      never replace it with a generic placeholder.

    Stock template sections (use headings in {language}; match market_summary):
    1. Header (name, ticker, ISIN, type, exchange, currency, report date)
    2. Executive summary (3-5 lines, all cited)
    3. What it is (description, sector, business profile)
    4. Key metrics (table: price, change, cap, P/E, dividend, beta)
    5. Performance (1D, 1W, 1M, 3M, 6M, 1Y, YTD from market_context)
    6. Latest fundamentals
    7. Forecasts and consensus (only if in market_context.forecasts, else N/A)
    8. Recent news (from news research)
    9. Risks and watchpoints (only if cited)
    10. Data limitations (verbatim from market_summary)
    11. References
    12. Disclaimer

    ETF template sections (use headings in {language}; match market_summary):
    1. Header
    2. Executive summary
    3. What it is (objective, benchmark, issuer, replication)
    4. Key metrics (NAV/price, TER, AUM, yield, category)
    5. Performance (performance periods)
    6. ETF profile (fund family from market_summary)
    7. Top holdings (verbatim table, weight summary, and sector weights from market_summary)
    8. Recent news
    9. Risks and watchpoints
    10. Data limitations (verbatim from market_summary)
    11. References
    12. Disclaimer

    For ETF reports do NOT include Latest fundamentals or Forecasts and consensus.

  expected_output: >
    A polished Markdown report in {language} following the correct template.
    Header must show ISIN, ticker, instrument type and report date.
    All numbers from market_context must cite [1].
    ETF reports must include the top holdings section when present in market_summary.
    Data limitations must list the bullet points from market_summary.
    News must cite [2+]. End with numbered References and Disclaimer.

  agent: report_composer
  context:
    - news_research_task
