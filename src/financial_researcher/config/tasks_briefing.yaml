market_analysis_task:
  async_execution: true
  description: >
    INTERNAL HANDOFF to chief_strategist — NOT human-facing prose.

    OUTPUT CONTRACT (mandatory):
    - Compact bullets or `key: value` lines ONLY. No paragraphs, introductions, or conclusions.
    - Do NOT repeat prices or % moves already in market_pulse_table (strategist has the table).
    - HARD CAP: ≤300 words total.
    - Every line: TICKER | fact | number | [N]. Cite market data with instrument [N] only.
    - Flag stale quotes and FX effects in one line each under `limitations:`.
    - No hedging filler ("it is worth noting", "overall", "in summary", etc.).
    - Express alpha vs benchmark rows; name leader/laggard by 1D with [N].

    Cover every instrument ({instrument_count}). Include forecasts/AUM only when non-null in JSON.

    --- RUN CONTEXT ---
    Session: {session_label} · {current_date} {current_time} · {language}
    Valid metrics this phase: {valid_metrics}
    Session orientation: {session_orientation}
    {market_pulse_table}
    {benchmark_context}
    {watchlist_context}
  expected_output: >
    ≤300 words. Bullet/kv blocks only:
    - `leader_1d:` TICKER pct [N]
    - `laggard_1d:` TICKER pct [N]
    - `alpha_vs_benchmark:` one line
    - Per TICKER: one bullet (divergence, forecast, FX flag, or "no extra") with [N]
    - `limitations:` stale/missing fields or "none"
    No prose paragraphs.
  agent: market_analyst

news_analysis_task:
  async_execution: true
  description: >
    INTERNAL HANDOFF to chief_strategist — NOT human-facing prose.

    OUTPUT CONTRACT (mandatory):
    - Compact bullets or `TICKER:` blocks ONLY. No paragraphs, introductions, or conclusions.
    - Do NOT restate performance figures from market_pulse_table.
    - HARD CAP: ≤450 words total.
    - Every headline line: TICKER | title | YYYY-MM-DD | [N] or new [N] | url
    - Preserve ALL citations — compact [N] or `url + date` so References can be built.
    - No hedging filler. Information-dense only.

    Workflow:
    1. Mine prefetched_news_digest; use research_reference_seed [N] exactly.
    2. Tools ONLY for HIGH gaps, <2 headlines, or |1D|/|1W|>2% unexplained.
       Hard cap: 4 tool calls per instrument, 12 per run.
    3. Scrape OFFICIAL source for HIGH stocks.
    4. CAUSAL sources only for 1D attribution; label BACKGROUND explicitly.
    5. Never use [1]..[{last_citation}] for news.

    --- RUN CONTEXT ---
    Session: {session_label} · {current_date} · Milan
    Stocks: {watchlist_stocks} · ETFs: {watchlist_etfs}
    {institutional_sources_guide}
    {watchlist_material_news}
    {research_reference_seed}
    {prefetched_news_digest}
    {instrument_profile_table}
  expected_output: >
    ≤450 words. Structure:
    - `high_impact:` TICKER — headline fact [N] url (one line per HIGH)
    - Per TICKER ({instrument_count}, none skipped): 1-2 bullets `title | date | [N] | url`
      or `no_headline: theme driver [N]`
    - `conflicts:` one line if any, else "none"
    - `macro_cross:` one line with [N] if relevant
    No ### headings, no prose paragraphs.
  agent: news_analyst

outlook_analysis_task:
  async_execution: true
  description: >
    INTERNAL HANDOFF to chief_strategist — NOT human-facing prose.

    OUTPUT CONTRACT (mandatory):
    - Compact bullets or `key: value` ONLY. No paragraphs, introductions, or conclusions.
    - Do NOT repeat YTD/1M figures from market_pulse_table.
    - HARD CAP: ≤350 words total.
    - Bull/Base/Bear: one bullet each with dated trigger → outcome and [N].
    - New sources from [{next_citation}]+. No ETF price targets.

    --- RUN CONTEXT ---
    Session: {session_label} · {current_date} · {language}
    Orientation: {session_orientation}
    Watchlist: {watchlist_tickers}
    {instrument_profile_table}
    {watchlist_context}
  expected_output: >
    ≤350 words:
    - `macro:` 2-3 bullets ECB/Fed/inflation/FX with [N]
    - Per theme/ticker group: 1 bullet driver with [N]
    - `bull:` trigger → thesis [N]
    - `base:` trigger → thesis [N]
    - `bear:` trigger → thesis [N]
    - `limitations:` or "none"
    No prose paragraphs.
  agent: outlook_analyst

calendar_analysis_task:
  async_execution: true
  description: >
    INTERNAL HANDOFF to chief_strategist — NOT human-facing prose.

    OUTPUT CONTRACT (mandatory):
    - One markdown table + ≤3 catalyst bullets. No prose intro/outro.
    - HARD CAP: ≤250 words total (table rows count toward cap).
    - Columns: | Date (YYYY-MM-DD) | Event | Affected tickers/themes | Impact | [N] |
    - Impact ∈ {Earnings, Macro release, Central bank, Corporate action, Sector data, Regulatory}
    - Confirmed YYYY-MM-DD + source URL required; omit unverified events.
    - New sources from [{next_citation}]+. Sort by date ascending.

    --- RUN CONTEXT ---
    Window: {calendar_window_start} .. {calendar_window_end} · Today: {current_date}
    Session: {session_label} · Split: {calendar_split}
    Tickers: {watchlist_tickers}
    {forward_calendar_table}
    {recent_dated_events_table}
    {instrument_profile_table}
  expected_output: >
    ≤250 words:
    - Markdown table (forward events only, dates in window)
    - `top_catalysts:` up to 3 lines `YYYY-MM-DD | event | [N]`
    - If none: `no_confirmed_events: true`
    No narrative paragraphs.
  agent: calendar_analyst
executive_briefing_task:
  description: >
    Write ONE executive watchlist briefing in {language} for session
    {session_label} on {current_date} at {current_time} (Borsa Italiana).
    Synthesise all analyst outputs from task context:
    - market analysis (performance, leaders/laggards)
    - news research (recent catalysts)
    - outlook analysis (3–12 month themes and scenarios)
    - calendar analysis (upcoming 2–4 week events)

    Material news ranking from prefetch — honour Impact HIGH/MEDIUM/LOW; at most 2 HIGH
    (already capped). Never inflate tags; reference/profile pages are not news:
    {watchlist_material_news}

    Research citations (deterministic — include ALL in References section):
    {research_reference_seed}

    Do not give buy/sell/hold advice.

    Instrument naming in all narrative text:
    {instrument_naming_guide}

    EDITORIAL STYLE (make it compelling and highly readable):
    - Open with a single vivid "market mood" line (one sentence) before the summary bullets.
    - Active, confident prose; varied sentence length; concrete verbs over hedging.
    - Consistent visual vocabulary used sparingly for scanning, never decoration:
      ▲ up · ▼ down · ► flat for moves; 🟠 MEDIUM where useful; no emoji on
      reference pages or LOW-impact items.
    - Bold the instrument name on first mention in each section.
    - Skimmable: bullets over walls of text; the Executive Summary reads in under 3 minutes.

    SOURCE FRESHNESS: honour CAUSAL vs BACKGROUND tags from prefetch — attribute 1D moves
    only to CAUSAL sources (≤3 trading days); label older sources as background/context.

    ANTI-REDUNDANCY (mandatory — keeps the memo concise):
    - Each performance figure (e.g. "+5.66% 1D") may appear at most TWICE in the
      entire memo: once in the performance table (injected by the pipeline) and once
      in prose. Do not repeat the same % in Executive Summary, Drivers, Outlook and Risks.
    - Each section must add NEW information not already stated in earlier sections.
      Do not restate or paraphrase the Executive Summary in Drivers, Outlook or Risks.
    - Target length: 1100–1400 words for narrative sections (exclude the performance
      table and References). Prefer density over repetition.

    The Executive Summary is the centrepiece.

    Required sections — use EXACTLY these headings (pre-localized for {language}):
    {briefing_section_headings}

    Section content rules:
    1. Title block (# level) — session, date, time, market, instrument count.
       Immediately under the title, one-line "market mood" hook.
    2. Executive Summary / Sommario Esecutivo — prioritised insights across all time horizons.
       Structure (do NOT use one long paragraph):
       - Opening (2-3 sentences): if watchlist_material_news lists a **dominant** HIGH story,
         the FIRST sentence must state that event with specific facts and [N]; then leader/laggard
         1D and nearest catalyst. Never open only with performance if a stock has HIGH issuer news.
       - Then {instrument_count} bullets — one per instrument as **Name (TICKER)** with 1D or 1W
         move (prefix ▲/▼/►) + headline. Impact **MEDIUM** may use 🟠 or no tag.
         Impact **NONE**: use performance + sector/theme with [N] only. HIGH bullets MUST lead
         with headline facts (cite [N]) — not 'speculation' or generic sector talk.
       MANDATORY: mention every instrument — none skipped:
       {watchlist_summary_checklist}
       Reserve [1]..[{last_citation}] for that instrument's market figures only.
       Use [{next_citation}]+ for news facts. Never use ticker alone without the full name.
    3. Performance section — write ONLY the section heading plus one sentence on
       1D leaders/laggards. The performance table is injected automatically by the
       pipeline; do NOT render a markdown table in this section.
    4. Drivers section — one entry per instrument as **Name (TICKER)** with news-linked explanation [N]:
       MANDATORY full coverage checklist (one entry per instrument, none skipped):
       {watchlist_driver_checklist}
       For Impact **HIGH** instruments, repeat the headline substance before interpretation.
       For each stock, cite specific
       issuer events before sector generalities. Never replace a sourced headline with vague
       words ('speculation', 'sector uncertainty') when a concrete title/source exists.
       When sources conflict on a name, surface both in one sentence.
       If news research found no headline for an instrument, still include it and
       explain the move using performance data and sector/theme context with [N].
    5. Outlook section — themes, scenarios, macro from outlook analysis with [N].
       MUST include Bull / Base / Bear bullets, each tied to a dated trigger, with citations.
    6. Calendar section — forward-looking events ONLY (dates >= {current_date}).
       Copy the calendar analyst forward table with the closed Impact taxonomy.
       Do NOT list past news here — those belong in Drivers, not Event Calendar.
       NEVER list an event without a confirmed YYYY-MM-DD and source URL.
       If no forward events exist, state that explicitly.
    7. Correlated themes section — cross-instrument links with [N]; cover tech cluster and
       non-tech names where relevant.
    8. Risks section — at least 3 cited bullets spanning macro and watchlist names.
    9. References section — Yahoo Finance [1]..[{last_citation}] and research citations are
       injected automatically by the pipeline. Cite [{next_citation}]+ in the body as needed.
    10. Disclaimer — informational only, not investment advice.

    Citation rules:
    - Market data prices/performance: [1]..[{last_citation}] only for the matching instrument.
    - News, outlook, calendar: [{next_citation}] and above only.
    - Every factual statement must carry [N].
    - Do not cite a number unless it appears in References (research) or is 1..[{last_citation}] for Yahoo.

    MISSING INPUT HANDLING: if any context input is empty/missing, note it under Data
    limitations — never fabricate to fill the gap.
  expected_output: >
    A polished, visually engaging Markdown executive briefing for the entire watchlist.
    Single cohesive memo (not separate per-instrument reports), opening with a one-line
    market-mood hook.
    Executive Summary must weave performance, news, outlook and calendar AND mention
    every instrument by Name (TICKER) ({instrument_count} instruments) — verify
    against watchlist_summary_checklist before finishing.
    The Performance section must include a one-line leader/laggard summary; the table is
    injected by post-processing.
    Section 4 (What's Driving the Moves) MUST contain exactly {instrument_count}
    entries — one per instrument as Name (TICKER), including stocks (e.g. STMicroelectronics (STMMI.MI))
    and every ETF. Verify against watchlist_driver_checklist before finishing.
    Event Calendar section must preserve exact YYYY-MM-DD dates and the closed Impact taxonomy.
    References are injected automatically by the pipeline.
  agent: chief_strategist
  context:
    - market_analysis_task
    - news_analysis_task
    - outlook_analysis_task
    - calendar_analysis_task