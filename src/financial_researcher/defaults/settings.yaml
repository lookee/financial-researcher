# Application settings for Financial Researcher.
# API keys belong in .env (see .env.sample at the project root).
# REPORT_LANGUAGE in .env overrides default_language below.

# Default language for generated briefings (e.g. English, Italian).
default_language: English

# Model lineup profile (balanced, frontier, budget, free). Overridden by FR_MODEL_PROFILE.
# model_profile: balanced

# Serper news/search (prefetch + agent tools).
serper:
  # Free Serper plans reject site: and long OR queries — auto-simplify (default true).
  free_tier: true

# Watchlist data pipeline (parallel ISIN resolve + market snapshots).
pipeline:
  max_workers: 4

# Benchmark indices appended to performance tables (alpha vs beta context).
benchmarks:
  - ticker: FTSEMIB.MI
    name: FTSE MIB
  - ticker: ^STOXX
    name: STOXX Europe 600

# Website scrape tool (ScrapeWebsiteTool used by news/outlook/calendar agents).
scrape:
  # When true (default), scraped pages are truncated before reaching the LLM.
  truncate_enabled: true
  # Max characters returned per scrape (suffix "[...troncato]" added when trimmed).
  max_chars: 2500
