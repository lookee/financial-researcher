# Model lineup profiles for the briefing crew.
# Select: FR_MODEL_PROFILE env, model_profile in defaults/settings.yaml, or --model-profile.
# Per-agent FR_MODEL_* env vars override the active profile for that agent only.

default_profile: balanced

profiles:
  balanced:
    description: >
      Default cost/quality mix — frontier on news and chief only; mini on market/calendar.
    agents:
      market: { model: openai/gpt-5.4-mini, reasoning: low }
      news: { model: openai/gpt-5.5, reasoning: medium }
      outlook: { model: openai/gpt-5.4, reasoning: low }
      calendar: { model: openai/gpt-5.4-mini, reasoning: low }
      chief: { model: openai/gpt-5.5, reasoning: medium }

  frontier:
    description: >
      All frontier OpenAI models — highest quality and cost; use for final memos.
    agents:
      market: { model: openai/gpt-5.5, reasoning: medium }
      news: { model: openai/gpt-5.5, reasoning: high }
      outlook: { model: openai/gpt-5.5, reasoning: medium }
      calendar: { model: openai/gpt-5.5, reasoning: low }
      chief: { model: openai/gpt-5.5, reasoning: high }

  budget:
    description: >
      Low-cost OpenAI — mini on analysts, gpt-5.4 on chief; expect thinner synthesis.
    agents:
      market: { model: openai/gpt-5.4-mini, reasoning: low }
      news: { model: openai/gpt-5.4-mini, reasoning: low }
      outlook: { model: openai/gpt-5.4-mini, reasoning: low }
      calendar: { model: openai/gpt-5.4-mini, reasoning: low }
      chief: { model: openai/gpt-5.4, reasoning: medium }

  free_groq:
    description: >
      Groq free tier via LiteLLM (set GROQ_API_KEY). Experimental — weaker citations.
    agents:
      market: { model: groq/llama-3.1-8b-instant, reasoning: low }
      news: { model: groq/llama-3.3-70b-versatile, reasoning: low }
      outlook: { model: groq/llama-3.3-70b-versatile, reasoning: low }
      calendar: { model: groq/llama-3.1-8b-instant, reasoning: low }
      chief: { model: groq/llama-3.3-70b-versatile, reasoning: low }

  free_openrouter_nex:
    description: >
      OpenRouter free tier — Nex AGI Nex-N2-Pro (set OPENROUTER_API_KEY). Experimental.
    agents:
      market: { model: openrouter/nex-agi/nex-n2-pro:free, reasoning: low }
      news: { model: openrouter/nex-agi/nex-n2-pro:free, reasoning: low }
      outlook: { model: openrouter/nex-agi/nex-n2-pro:free, reasoning: low }
      calendar: { model: openrouter/nex-agi/nex-n2-pro:free, reasoning: low }
      chief: { model: openrouter/nex-agi/nex-n2-pro:free, reasoning: medium }

  anthropic:
    description: >
      Anthropic cost/quality mix (set ANTHROPIC_API_KEY) — Haiku on analysts, Sonnet on news/chief.
    agents:
      market: { model: anthropic/claude-haiku-4-5, reasoning: low }
      news: { model: anthropic/claude-sonnet-4-6, reasoning: medium }
      outlook: { model: anthropic/claude-sonnet-4-6, reasoning: low }
      calendar: { model: anthropic/claude-haiku-4-5, reasoning: low }
      chief: { model: anthropic/claude-sonnet-4-6, reasoning: medium }

  deepseek:
    description: >
      DeepSeek only (set DEEPSEEK_API_KEY) — V4 Flash on analysts, V4 Pro on news/chief.
    agents:
      market: { model: deepseek/deepseek-v4-flash, reasoning: low }
      news: { model: deepseek/deepseek-v4-pro, reasoning: medium }
      outlook: { model: deepseek/deepseek-v4-flash, reasoning: low }
      calendar: { model: deepseek/deepseek-v4-flash, reasoning: low }
      chief: { model: deepseek/deepseek-v4-pro, reasoning: medium }

  multi:
    description: >
      Multi-provider mix — DeepSeek analysts, Anthropic news, OpenAI outlook + chief.
      Requires DEEPSEEK_API_KEY, ANTHROPIC_API_KEY, and OPENAI_API_KEY.
    agents:
      market: { model: deepseek/deepseek-v4-flash, reasoning: low }
      news: { model: anthropic/claude-sonnet-4-6, reasoning: medium }
      outlook: { model: openai/gpt-5.4, reasoning: low }
      calendar: { model: deepseek/deepseek-v4-flash, reasoning: low }
      chief: { model: openai/gpt-5.5, reasoning: medium }
